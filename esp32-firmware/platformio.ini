[platformio]
src_dir = .
default_envs = integrated-wifi
[env]
platform = espressif32@6.12.0
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
lib_deps =
 sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@1.1.2
 sparkfun/SparkFun LSM6DS3 Breakout@1.0.3
 adafruit/Adafruit SSD1306@2.5.13
 adafruit/Adafruit GFX Library@1.12.1
 bblanchon/ArduinoJson@7.4.2
[env:integrated]
build_src_filter = -<*> +<integrated/main.cpp>
[env:integrated-wifi]
build_src_filter = -<*> +<integrated/main.cpp>
[env:scanner]
build_src_filter = -<*> +<tests/scanner.cpp>
[env:max30102]
build_src_filter = -<*> +<tests/max30102.cpp>
[env:lsm6ds3]
build_src_filter = -<*> +<tests/lsm6ds3.cpp>
[env:oled]
build_src_filter = -<*> +<tests/oled.cpp>
[env:oled32]
build_src_filter = -<*> +<tests/oled.cpp>
build_flags = -DOLED_HEIGHT=32
[env:integrated32]
build_src_filter = -<*> +<integrated/main.cpp>
build_flags = -DOLED_HEIGHT=32
