server:
  address: ${SMARTTRACK_BIND:127.0.0.1}
  port: ${SMARTTRACK_PORT:8080}
  error:
    include-message: never
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${SMARTTRACK_DB_URL:jdbc:mysql://127.0.0.1:3306/smarttrack?connectionTimeZone=UTC}
    username: ${SMARTTRACK_DB_USER:smarttrack}
    password: ${SMARTTRACK_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      fail-on-missing-creator-properties: true
      fail-on-null-for-primitives: true
  servlet:
    multipart:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health
smarttrack:
  retention-days: ${SMARTTRACK_RETENTION_DAYS:30}
  allow-simulator: ${SMARTTRACK_ALLOW_SIMULATOR:false}
logging:
  level:
    root: INFO
    org.springframework: INFO
