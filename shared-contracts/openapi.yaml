        "responses": {
          "200": {
            "description": "Success",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Login"
                }
              }
            }
          },
          "400": {
            "description": "Invalid v1 contract"
          },
          "401": {
            "description": "Missing or expired credentials"
          },
          "403": {
            "description": "Credential scope does not permit this action"
          },
          "404": {
            "description": "Resource unavailable to this owner"
          },
          "409": {
            "description": "Conflicting idempotency key or revision"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Credentials"
              }
            }
          }
        },
        "security": []
      }
    },
    "/v1/auth/logout": {
      "post": {
        "summary": "Revoke the current user token",
        "description": "",
        "responses": {
          "200": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid v1 contract"
          },
