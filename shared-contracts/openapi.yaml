{
  "openapi": "3.1.0",
  "info": {
    "title": "SmartTrack API",
    "version": "1.1.0",
    "description": "Experimental connected-device monitoring. UTC instants, nullable measurements, explicit provenance."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8087",
      "description": "Local simulator development; production requires HTTPS"
    }
  ],
  "security": [
    {
      "bearerAuth": []
    }
  ],
  "paths": {
    "/v1/auth/register": {
      "post": {
        "summary": "Create a user",
        "description": "",
        "responses": {
          "201": {
            "description": "Success"
          },
          "400": {
            "description": "Invalid v1 contract"
          },
          "401": {
            "description": "Missing or expired credentials"
          },
          "403": {
            "description": "Credential scope does not permit this action"
          },
          "404": {
            "description": "Resource unavailable to this owner"
          },
          "409": {
            "description": "Conflicting idempotency key or revision"
          }
        },
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/Credentials"
              }
            }
          }
        },
        "security": []
      }
    },
    "/v1/auth/login": {
      "post": {
        "summary": "Obtain a 12-hour opaque user token",
