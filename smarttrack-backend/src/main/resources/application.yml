server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/smarttrack}
    username: ${DB_USER:smarttrack}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
smarttrack:
  bootstrap-user: ${SMARTTRACK_USER:}
  bootstrap-password: ${SMARTTRACK_PASSWORD:}
  mock-enabled: ${MOCK_ENABLED:false}
  cors-origins: ${CORS_ORIGINS:}
logging:
  level:
    org.springframework.web: INFO
    org.hibernate.SQL: WARN
  structured:
    format:
      file: ecs
  file:
    name: logs/smarttrack.log
