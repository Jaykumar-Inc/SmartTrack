plugins { id 'com.android.application' }
android {
 namespace 'io.smarttrack.android'
 compileSdk 36
 defaultConfig { applicationId 'io.smarttrack.android'; minSdk 26; targetSdk 36; versionCode 4; versionName '1.1.0'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 buildFeatures { viewBinding true; buildConfig true }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17; coreLibraryDesugaringEnabled true }
 sourceSets { main.java.srcDir '../../shared-contracts/src/main/java'; androidTest.assets.srcDir '../../shared-contracts' }
 signingConfigs { release { if (System.getenv('SMARTTRACK_KEYSTORE')) { storeFile file(System.getenv('SMARTTRACK_KEYSTORE')); storePassword System.getenv('SMARTTRACK_STORE_PASSWORD'); keyAlias System.getenv('SMARTTRACK_KEY_ALIAS'); keyPassword System.getenv('SMARTTRACK_KEY_PASSWORD') } } }
 buildTypes { debug { manifestPlaceholders = [cleartextAllowed:'true'] }; release { manifestPlaceholders = [cleartextAllowed:'false']; if (System.getenv('SMARTTRACK_KEYSTORE')) signingConfig signingConfigs.release; minifyEnabled false } }
}
dependencies {
 implementation 'androidx.appcompat:appcompat:1.7.0'
 implementation 'com.google.android.material:material:1.12.0'
 implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
 implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
 implementation 'androidx.room:room-runtime:2.6.1'
 annotationProcessor 'androidx.room:room-compiler:2.6.1'
 implementation 'androidx.work:work-runtime:2.10.0'
 implementation 'com.squareup.retrofit2:retrofit:2.11.0'
 implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
 implementation 'com.squareup.okhttp3:okhttp:4.12.0'
 implementation 'com.google.code.gson:gson:2.12.1'
 coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
 testImplementation 'junit:junit:4.13.2'
 androidTestImplementation 'androidx.test.ext:junit:1.3.0'
 androidTestImplementation 'androidx.test:runner:1.7.0'
 androidTestImplementation 'androidx.test:core:1.7.0'
 androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
